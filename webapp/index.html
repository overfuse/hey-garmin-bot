<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Настройки тренировок</title>
<style>
  /* Theme comes entirely from Telegram's CSS variables so the page follows
     the client's light/dark palette; the second value is the fallback for
     opening the page in a plain browser while debugging. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    color: var(--tg-theme-text-color, #000);
    font-size: 16px;
  }
  main { padding: 16px 16px 96px; max-width: 480px; margin: 0 auto; }
  h1 {
    font-size: 13px; font-weight: 500; text-transform: uppercase;
    letter-spacing: .4px; color: var(--tg-theme-hint-color, #8e8e93);
    margin: 8px 4px 8px;
  }
  .card {
    background: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fff));
    border-radius: 12px; overflow: hidden;
  }
  .card + .card { margin-top: 16px; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .row + .row { border-top: .5px solid var(--tg-theme-secondary-bg-color, #f0f0f0); }
  .row .text { flex: 1; }
  .row .label { display: block; }
  .row .hint {
    display: block; font-size: 13px; margin-top: 2px;
    color: var(--tg-theme-hint-color, #8e8e93);
  }
  /* iOS-style switch on a plain checkbox */
  .row input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; flex: none;
    width: 51px; height: 31px; border-radius: 16px;
    background: var(--tg-theme-hint-color, #ccc);
    position: relative; transition: background .15s; cursor: pointer;
  }
  .row input[type="checkbox"]:checked {
    background: var(--tg-theme-button-color, #2481cc);
  }
  .row input[type="checkbox"]::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 27px; height: 27px; border-radius: 50%;
    background: #fff; transition: left .15s;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .row input[type="checkbox"]:checked::after { left: 22px; }
  .row select {
    flex: none; font: inherit; padding: 4px 8px; border-radius: 8px;
    border: none; color: var(--tg-theme-text-color, #000);
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
  }
  #status {
    margin: 12px 4px 0; font-size: 14px;
    color: var(--tg-theme-hint-color, #8e8e93);
  }
  #status.error { color: var(--tg-theme-destructive-text-color, #d33); }
  body.loading .card { opacity: .45; pointer-events: none; }
</style>
</head>
<body class="loading">
<main>
  <!-- Text below is the Russian (default) fallback; app.js re-renders it in
       the user's language from its STRINGS table via data-i18n keys. -->
  <h1 data-i18n="structure">Структура тренировки</h1>
  <div class="card">
    <label class="row">
      <span class="text">
        <span class="label" data-i18n="add_warmup">Всегда добавлять разминку</span>
        <span class="hint" data-i18n="add_warmup_hint">Добавлять разминку, даже если в плане её нет</span>
      </span>
      <input type="checkbox" id="add_warmup">
    </label>
    <label class="row">
      <span class="text">
        <span class="label" data-i18n="add_cooldown">Всегда добавлять заминку</span>
        <span class="hint" data-i18n="add_cooldown_hint">Добавлять заминку, даже если в плане её нет</span>
      </span>
      <input type="checkbox" id="add_cooldown">
    </label>
    <label class="row">
      <span class="text">
        <span class="label" data-i18n="wu_cd_lap_press">Завершать разминку/заминку кнопкой круга</span>
        <span class="hint" data-i18n="wu_cd_lap_press_hint">Без дистанции и времени — закончить нажатием кнопки Lap на часах</span>
      </span>
      <input type="checkbox" id="wu_cd_lap_press">
    </label>
    <label class="row">
      <span class="text">
        <span class="label" data-i18n="wu_cd_skip_pace">Без темпа на разминке/заминке</span>
        <span class="hint" data-i18n="wu_cd_skip_pace_hint">Не задавать целевой темп для разминки и заминки</span>
      </span>
      <input type="checkbox" id="wu_cd_skip_pace">
    </label>
  </div>
  <div class="card">
    <label class="row">
      <span class="text">
        <span class="label" data-i18n="reject_non_workouts">Игнорировать сообщения, которые не тренировки</span>
        <span class="hint" data-i18n="reject_non_workouts_hint">Не отправлять в Garmin болтовню, вопросы и благодарности. Выключите, если настоящая тренировка отклоняется</span>
      </span>
      <input type="checkbox" id="reject_non_workouts">
    </label>
  </div>
  <h1 data-i18n="messages">Сообщения бота</h1>
  <div class="card">
    <label class="row">
      <span class="text">
        <span class="label" data-i18n="show_processing_time">Показывать время обработки</span>
        <span class="hint" data-i18n="show_processing_time_hint">Добавлять «⚡ Обработано за N мс» к подтверждению загрузки</span>
      </span>
      <input type="checkbox" id="show_processing_time">
    </label>
    <label class="row">
      <span class="text">
        <span class="label" data-i18n="language">Язык</span>
        <span class="hint" data-i18n="language_hint">Язык сообщений бота и этой страницы</span>
      </span>
      <select id="lang">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
  <p id="status">Загрузка…</p>
</main>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/app.js"></script>
</body>
</html>
